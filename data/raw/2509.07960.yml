Description: 'This is a file containing galaxy stellar mass functions from Chaikin
  et al. (2026; https://doi.org/10.1093/mnras/stag740). Galaxy stellar mass functions
  from the following COLIBRE simulations are available: [''COLIBRE_L025m5'', ''COLIBRE_L025m6'',
  ''COLIBRE_L025m7'', ''COLIBRE_L050m5'', ''COLIBRE_L050m6'', ''COLIBRE_L050m7'',
  ''COLIBRE_L100m5'', ''COLIBRE_L100m6'', ''COLIBRE_L100m7'', ''COLIBRE_L200m6'',
  ''COLIBRE_L200m7'', ''COLIBRE_L200m7h'', ''COLIBRE_L400m7'']. Galaxy stellar mass
  functions at the following redshifts are available: [''z0.0'', ''z0.1'', ''z0.5'',
  ''z1.0'', ''z2.0'', ''z3.0'', ''z4.0'', ''z5.0'', ''z6.0'', ''z7.0'', ''z8.0'',
  ''z9.0'', ''z10.0'', ''z11.0'', ''z12.0'', ''z13.0'', ''z14.0'', ''z15.0'', ''z16.0'',
  ''z17.0'']. All stellar mass bins have a width of 0.2 dex. The units of x values
  are Msun. The units of y values are cMpc^{-3} dex^{-1}. The cosmology is the COLIBRE
  cosmology: Om = 0.306, Ob = 0.0486, h = 0.681. Uses a Chabrier (2003) initial stellar
  mass function. The key ''gsmf_raw'' corresponds to galaxy stellar mass functions
  without Eddington bias (i.e. raw values predicted by simulations). The key ''gsmf_with_edd_bias''
  corresponds to galaxy stellar mass functions where galaxy stellar masses have been
  convolved with a Gaussian of zero mean and a scatter of \sigma(z) = min(0.1 + 0.1
  z, 0.3) dex to model the effect of Eddington bias. In addition to the x and y values
  of the galaxy stellar mass functions, the number of galaxies in each bin is also
  recorded. Bins with zero counts are omitted. '
