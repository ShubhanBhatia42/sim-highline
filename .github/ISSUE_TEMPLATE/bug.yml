name: Something on the site or Explorer is broken or unclear
description: A page that does not load, a button that does nothing, a number that looks wrong, wording you could not follow
title: "[site] "
labels: ["site"]
body:
  - type: input
    id: page
    attributes:
      label: Which page, and what were you trying to do?
      placeholder: "e.g. the dials page, trying to make SIMBA look like TNG"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Browser and device (optional)
      placeholder: "e.g. Safari on an iPhone, Firefox 130 on Linux"
  - type: textarea
    id: link
    attributes:
      label: The address you were on (the part after # holds your settings)
