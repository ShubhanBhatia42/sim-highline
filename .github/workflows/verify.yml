name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      regress:
        description: "Also regenerate every digitized record from its arXiv source (slow, needs network)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Verification chain
        run: ./scripts/verify-all.sh
      - name: Generated files are up to date
        run: |
          git diff --exit-code --stat || { git --no-pager diff -U0 | head -80; echo "::error::Generated files changed. Run ./scripts/verify-all.sh locally and commit the result."; exit 1; }
      - name: Package builds and loads
        run: |
          pip wheel . --no-deps -w /tmp/wheel
          pip install --no-deps --target /tmp/site /tmp/wheel/*.whl
          cd /tmp && PYTHONPATH=/tmp/site python -c "import sim_highline as s; df = s.load(); print(df.attrs['version'], len(df))"
      - name: The installed command derives and compares, and refuses what it cannot know
        run: |
          cd /tmp
          CAT="$GITHUB_WORKSPACE/tests/derive-cli/eagle/eagle-export.csv"
          export PYTHONPATH=/tmp/site
          /tmp/site/bin/sim-highline derive --format eagle --catalog "$CAT" --source CI --run synthetic --imf chabrier03 --baryon-particle-mass 1e6 --h 0.6777 --omega-m 0.307 --box-mpc 25 --units eagle-database --aperture 30pkpc --out /tmp/run.json --compare --top 1
          if /tmp/site/bin/sim-highline derive --format eagle --catalog "$CAT" --source CI --run synthetic --baryon-particle-mass 1e6 --out /tmp/refused.json; then echo "::error::derive accepted an under-specified catalogue"; exit 1; fi
          test ! -e /tmp/refused.json
      - name: Digitizer regression
        if: github.event_name == 'workflow_dispatch' && inputs.regress
        run: python3 scripts/regress_digitizers.py
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/build-static.mjs && node scripts/build-highline.mjs && node scripts/build-site.mjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (layout, views, themes, embed, phone, links, accessibility)
        run: node scripts/test-ui.mjs
      - name: Walk-throughs and the check-your-run flow
        run: node scripts/test-journeys.mjs && node scripts/test-yourrun.mjs && node scripts/test-dials.mjs
      - name: Every page at every width, keyboard only, and when things go wrong
        run: node scripts/test-layouts.mjs && node scripts/test-keyboard.mjs && node scripts/test-a11y-tree.mjs --explorer && node scripts/test-resilience.mjs && node scripts/test-parity.mjs
      - name: The build is deterministic
        run: node scripts/test-determinism.mjs
      - name: Speed budget on a slow phone
        run: node scripts/test-performance.mjs
  other-browsers:
    # Firefox and Safari's engine. Informational: a failure here is reported but does not block, because these runs have never been made in the environment this was written in.
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/build-static.mjs && node scripts/build-highline.mjs && node scripts/build-site.mjs
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Browser tests
        env:
          PW_BROWSER: ${{ matrix.browser }}
        run: |
          fail=0
          for t in test-ui test-journeys test-dials test-keyboard test-a11y-tree test-layouts; do node scripts/$t.mjs || fail=1; done
          exit $fail
